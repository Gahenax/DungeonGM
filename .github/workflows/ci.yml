name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Import backend app
        working-directory: backend
        run: python -c "from main import app; print(app.title)"
      - name: Smoke test dice engine
        working-directory: backend
        run: python -c "from rules.dice_engine import DiceEngine; print(DiceEngine(seed=1).roll('1d20+5'))"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Type check
        run: npm run type-check
      - name: Build frontend
        run: npm run build
